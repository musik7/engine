name: Clone hello-jni app folder
on: workflow_dispatch

jobs:
  clone:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sparse clone folder app doang
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/android/ndk-samples
          cd ndk-samples
          git sparse-checkout set hello-jni/app
          mv hello-jni/app/*../
          cd..
          rm -rf ndk-samples

      - name: Commit & push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add --all
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Clone hello-jni/app"

          git remote set-url origin "https://${GITHUB_TOKEN}@github.com/${REPO}.git"

          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ -z "$BRANCH" ]; then
            BRANCH="main"
          fi

          git pull origin "$BRANCH" --rebase --allow-unrelated-histories
          git push origin "HEAD:${BRANCH}"
