name: Clone hello-jni app folder
on: workflow_dispatch

jobs:
  clone:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download folder hello-jni/app
        run: |
          mkdir -p app
          curl -L https://api.github.com/repos/android/ndk-samples/contents/hello-jni/app?ref=main -o files.json
          sudo apt-get install jq -y
          jq -r '.[] |.download_url' files.json | while read url; do
            fname=$(basename $url)
            curl -L $url -o app/$fname
          done

          # Download subfolders
          curl -L https://api.github.com/repos/android/ndk-samples/contents/hello-jni/app/src -o src.json
          mkdir -p app/src
          jq -r '.[] |.download_url' src.json | while read url; do
            fname=$(basename $url)
            curl -L $url -o app/src/$fname
          done

      - name: Commit files ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/
          git commit -m "Add hello-jni/app folder" || exit 0
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
